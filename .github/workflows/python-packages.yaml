name: Check Python packages
on:
  push:
    branches:
      - main
    paths:
      - packages/python/**
  pull_request:
    paths:
      - packages/python/**

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [openpipeline_testutils, openpipeline_ioutils]

    steps:
    - uses: actions/checkout@v6

    - name: Using Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install tox
      run: python -m pip install tox

    - name: Run ruff
      run: |
        cd packages/python/${{ matrix.package }}
        tox -e ruff

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [openpipeline_ioutils]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - name: Using Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox
      run: python -m pip install tox

    - name: Run tests
      run: |
        cd packages/python/${{ matrix.package }}
        tox -e py

    - name: Run mypy
      if: matrix.python-version == '3.11'
      run: |
        cd packages/python/${{ matrix.package }}
        tox -e mypy
