# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py, ruff, mypy
isolated_build = True

[testenv]
deps =
    pytest
    geopandas
    shapely
commands = pytest {posargs}

[testenv:ruff]
deps = ruff
skip_install = true
commands = ruff check

[testenv:mypy]
deps =
    mypy
    pytest
    pandas-stubs
    types-shapely
commands = mypy {posargs}
