# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py, ruff, mypy
isolated_build = True

[testenv]
extras = all
dependency_groups = test
commands = pytest {posargs}

[testenv:ruff]
deps = ruff
dependency_groups =
skip_install = true
commands = ruff check

[testenv:mypy]
extras = all
dependency_groups = typecheck
commands = mypy {posargs}
